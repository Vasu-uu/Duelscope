[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duelscope"
dynamic = ["version"]
description = "One command to compare object detectors: mAP, per-class errors, failure-case gallery, and speed on your own hardware."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vasu" }]
keywords = ["object-detection", "benchmark", "yolo", "map", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "pyyaml>=6",
    "numpy>=1.24",
    "pillow>=10",
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.3"]
onnx = ["onnxruntime>=1.16"]
torchvision = ["torch>=2.1", "torchvision>=0.16"]
all = ["duelscope[ultralytics,onnx,torchvision]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.0"]

[project.scripts]
duelscope = "duelscope.cli:app"

[project.entry-points."duelscope.adapters"]

[project.urls]
Homepage = "https://github.com/Vasu-uu/Duelscope"
Issues = "https://github.com/Vasu-uu/Duelscope/issues"

[tool.hatch.version]
path = "src/duelscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/duelscope"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "gpu: test requires a CUDA GPU (skipped when none is present)",
    "ultralytics: test requires Ultralytics weights (skipped when unavailable)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["duelscope"]
